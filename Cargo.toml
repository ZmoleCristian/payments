[package]
name = "payments"
version = "0.1.0"
edition = "2024"

[dependencies]

[profile.release]
overflow-checks = true

[lints.rust]
unsafe_code = "deny"
unreachable_pub = "warn"

[lints.rustdoc]
broken_intra_doc_links = "deny"

[lints.clippy]
unwrap_used = "deny"
expect_used = "deny"
panic = "deny"
todo = "deny"
unimplemented = "deny"
dbg_macro = "deny"
float_arithmetic = "deny"
integer_division = "deny"
as_conversions = "deny"
disallowed_types = "deny"
indexing_slicing = "deny"
